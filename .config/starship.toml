# See https://starship.rs/config/

palette = "catppuccin_mocha"
command_timeout = 3000

format = """
$username\
$hostname\
$localip\
$shlvl\
$kubernetes\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$docker_context\
$java\
$kotlin\
$gradle\
$lua\
$nodejs\
$python\
$rust\
$terraform\
$memory_usage\
$aws\
$custom\
$sudo\
$cmd_duration\
$line_break\
$status\
$container\
$shell\
$character"""

[character]
success_symbol = "[❯](bold green)"

[directory]
read_only = " 󰌾"
truncation_length = 0
style = 'bold lavender'

[directory.substitutions]
"all-the-things" = "@att"

[docker_context]
symbol = " "

[git_branch]
symbol = " "
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold overlay0"

[gradle]
disabled = true

[hostname]
format="[$hostname]($style) in "
style="bold lavender"

[java]
symbol = " "
format = "[$symbol($version)]($style)"
style = "bold flamingo"

[kotlin]
disabled = true

[lua]
symbol = " "

[nodejs]
symbol = " "
disabled = true

[package]
symbol = "󰏗 "

[python]
symbol = " "
disabled = true

[username]
format = "[](bold lavender) [$user]($style) on "
style_user = "bold rosewater"
style_root = "bold red"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
