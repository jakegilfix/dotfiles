# ======================================
# GLOBALS
# ======================================
set -g default-terminal "screen-256color"
set-option -g terminal-overrides ",xterm-256color:RGB"
set -g default-shell /usr/local/bin/fish
set -g detach-on-destroy off
set -g set-clipboard on
set -g mouse on
set-window-option -g mode-keys vi

# very large history
set -g history-limit 50000

# index from 1
set -g base-index 1
setw -g pane-base-index 1

# ======================================
# KEY BINDINGS
# ======================================
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

unbind %
bind | split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

bind-key x kill-pane # skip "kill pane?" prompt

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with 'v'
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with 'y'

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# mouse support
bind -n WheelUpPane copy-mode -e

# ======================================
# STYLES
# ======================================
thm_rosewater="#f5e0dc"
thm_flamingo="#f2cdcd"
thm_pink="#f5c2e7"
thm_mauve="#cba6f7"
thm_red="#f38ba8"
thm_maroon="#eba0ac"
thm_peach="#fab387"
thm_yellow="#f9e2af"
thm_green="#a6e3a1"
thm_teal="#94e2d5"
thm_sky="#89dceb"
thm_sapphire="#74c7ec"
thm_blue="#89b4fa"
thm_lavender="#b4befe"
thm_text="#cdd6f4"
thm_subtext1="#bac2de"
thm_subtext0="#a6adc8"
thm_overlay2="#9399b2"
thm_overlay1="#7f849c"
thm_overlay0="#6c7086"
thm_surface2="#585b70"
thm_surface1="#45475a"
thm_surface0="#313244"
thm_base="#1e1e2e"
thm_mantle="#181825"
thm_crust="#11111b"

set-option -g set-titles on
set-option -g set-titles-string "#W"
set-option -gw pane-border-indicators "arrows"
setw -g window-status-format "#[fg=${thm_lavender}]#I #[fg=${thm_text}]#W#{?window_zoomed_flag, ,}"
setw -g window-status-current-format "#[fg=${thm_lavender}]#I #[fg=${thm_green}, bold]#W#{?window_zoomed_flag, ,}"
setw -g window-status-separator "#[fg=${thm_rosewater}] ⏐ "
set -g pane-active-border-style "fg=${thm_lavender},bg=default"
set -g pane-border-style "fg=${thm_surface1},bg=default"
set -g popup-border-style "fg=${thm_overlay1},bg=${thm_base}"
set -g popup-border-lines rounded

set -g copy-mode-match-style "bg=${thm_surface1}"
set -g copy-mode-current-match-style "fg=${thm_lavender},bg=${thm_yellow}"
set -g mode-style "bg=${thm_surface0}"

set -g status "on"
set -g status-style bg=default
set -g status-position top
set -g status-left-length 50
set -g status-left "#[fg=${thm_rosewater}, bold]#S #[fg=${thm_peach}]▸ "
set -g status-right-length 0
set -g status-right ""
set -g status-justify left
set -g status-interval 1

set -g message-style fg="${thm_yellow},bold",bg="${thm_crust}",align="centre"
set -g message-command-style fg="${thm_blue}",bg="${thm_base}",align="centre"

set -ga update-environment FZF_DEFAULT_OPTS

# ======================================
# PLUGINS
# ======================================
# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions every 16 minutes
set -g @t-fzf-prompt '  '
set -g @plugin 'joshmedeski/t-smart-tmux-session-manager'
#set -g @plugin 'catppuccin/tmux' # catppuccin theme

# catppuccin theme config
#set -g @catppuccin_flavour 'mocha' # or frappe, macchiato, latte
#set -g @catppuccin_status_left_separator "\u2588"
#set -g @catppuccin_window_default_text "#W" # display window name instead of current directory
#set -g @catppuccin_window_current_text "#W" # display window name instead of current directory

# vim-tmux-navigator
set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-{h,j,k,l}
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# save/persist sessions
set -g @resurrect-capture-pane-contents 'on' # allow tmux-resurrect to capture pane contents
set -g @continuum-restore 'on' # enable tmux-continuum functionality

# ======================================
# LEAVE THIS AT THE BOTTOM
# ======================================
# initialize tmux plugin manager (keep this line at the VERY BOTTOM of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
